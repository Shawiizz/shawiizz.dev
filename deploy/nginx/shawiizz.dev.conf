# shawiizz.dev and {{ MAIN_DOMAIN }}, to Dockflow's switch, and 12.shawiizz.dev, a static site of the host.
# Deployed by the nginx plugin of dockflow.yml: edit it here, not on the server.
server {
    listen 80;
    listen [::]:80;

    server_name shawiizz.dev www.shawiizz.dev {{ MAIN_DOMAIN }} www.{{ MAIN_DOMAIN }};

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header Access-Control-Allow-Origin "*";
}

server {
    listen 80;
    listen [::]:80;

    server_name 12.shawiizz.dev www.12.shawiizz.dev;

    root /var/www/douze;
    index index.html index.htm index.php;

    location / {
        try_files $uri $uri/ =404;
    }

    add_header Access-Control-Allow-Origin "*";
}
