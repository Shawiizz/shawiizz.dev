name: Deploy

# A pull request gets the plan of its change as a comment; a tag 1.2.3 deploys to production.
on:
  pull_request:
  push:
    tags: ['*']

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'production' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Shawiizz/dockflow@v4.0.0-alpha.10
        with:
          env: production
          command: ${{ github.event_name == 'push' && 'deploy --wait-lock 10m' || '' }}
        env:
          PRODUCTION_CONNECTION: ${{ secrets.PRODUCTION_CONNECTION }}
