name: Deploy

# A tag 1.2.3 deploys to production.
on:
  push:
    tags: ['*']

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dockflow
        run: curl -fsSL https://raw.githubusercontent.com/Shawiizz/dockflow/v4.0.0-alpha.4/install.sh | sh -s -- --version v4.0.0-alpha.4
      - name: Deploy
        run: dockflow deploy --wait-lock 10m
        env:
          PRODUCTION_CONNECTION: ${{ secrets.PRODUCTION_CONNECTION }}
