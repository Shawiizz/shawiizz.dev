name: Deploy

# A tag 1.2.3 deploys to production.
on:
  push:
    tags: ['*']

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Shawiizz/dockflow@v4.0.0-alpha.10
        with:
          command: deploy --wait-lock 10m
        env:
          PRODUCTION_CONNECTION: ${{ secrets.PRODUCTION_CONNECTION }}
