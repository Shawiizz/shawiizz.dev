version: 1
app: shawiizz-dev

# the vhost of the host's nginx, from deploy/nginx/shawiizz.dev.conf: checked and reloaded when it changes
plugins:
  - use: nginx
    with:
      template: deploy/nginx/shawiizz.dev.conf
      name: shawiizz.dev.conf

# checked after the switch, through the host's nginx
health:
  endpoints:
    - name: site
      url: https://${MAIN_DOMAIN}/
      expected_status: 200
      timeout: 30s
      retries: 3
      retry_delay: 5s

environments:
  production:
    vars:
      MAIN_DOMAIN: maelferi.com
